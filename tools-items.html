<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Item — Stellar Seekers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .item-card {
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid var(--gray-100);
    }

    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--blue-light);
    }

    .modal-content {
      border-radius: var(--radius-lg);
      border: none;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--blue-soft), white);
      border-bottom: none;
    }

    .nav-pills .nav-link {
      border-radius: 20px;
      margin: 0 4px;
      padding: 8px 16px;
    }

    .nav-pills .nav-link.active {
      background-color: var(--blue-dark);
    }

    .enhancement-tree .border {
      transition: all 0.2s;
    }

    .enhancement-tree .border:hover {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transform: scale(1.02);
    }
  </style>
</head>

<body style="scroll-behavior: smooth;">

  <!-- PAGE LOADER -->
  <div id="page-loader">
    <div class="loader-orbit">
      <div class="loader-core"></div>
      <div class="loader-ring"><span class="loader-moon"></span></div>
    </div>
    <p class="loader-label">Stellar Seekers</p>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg fixed-top" id="mainNavbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
        <div class="logo-placeholder">
          <img src="https://via.placeholder.com/80x80/1e3a8a/ffffff?text=SS" alt="Logo">
        </div>
        <span>Stellar Seekers</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="tools.html">Toram Tools</a></li>
          <li class="nav-item"><a class="nav-link active" href="tools-items.html">Item</a></li>
          <li class="nav-item"><a class="nav-link" href="monsters.html">Monster</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <section class="section-padding" style="padding-top: 120px; min-height: 100vh; background-color: var(--gray-50);">
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold display-5" style="color: var(--blue-dark);">Database Item Toram Online</h2>
        <p class="text-muted fs-5">Cari senjata, armor, material, dan crysta dengan mudah. Data diupdate otomatis dari
          Google Sheets.</p>
      </div>

      <!-- FILTERS & SEARCH -->
      <div class="form-card p-4 mb-4">
        <div class="row g-3">
          <div class="col-md-5">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" id="searchInput" class="form-control border-start-0"
                placeholder="Cari nama item (contoh: Shadow Blade)...">
            </div>
          </div>
          <div class="col-md-3">
            <select id="filterType" class="form-select">
              <option value="all">Semua Tipe</option>
              <option value="1h-sword">1H Sword</option>
              <option value="2h-sword">2H Sword</option>
              <option value="katana">Katana</option>
              <option value="bow">Bow</option>
              <option value="bowgun">Bowgun</option>
              <option value="staff">Staff</option>
              <option value="md">Magic Device</option>
              <option value="knuckles">Knuckles</option>
              <option value="halberd">Halberd</option>
              <option value="dagger">Dagger</option>
              <option value="armor">Armor</option>
              <option value="shield">Shield</option>
              <option value="additional">Additional</option>
              <option value="special">Special / Ring</option>
              <option value="crysta-weapon">Weapon Crysta</option>
              <option value="crysta-armor">Armor Crysta</option>
              <option value="crysta-add">Additional Crysta</option>
              <option value="crysta-special">Special Crysta</option>
              <option value="crysta-normal">Normal Crysta</option>
              <option value="material">Material</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="filterRarity" class="form-select">
              <option value="all">Semua Rarity</option>
              <option value="event">Event</option>
              <option value="non-event">Non-Event</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="filterSource" class="form-select">
              <option value="all">Semua Source</option>
              <option value="drop">Drop</option>
              <option value="craft-npc">Craft NPC</option>
              <option value="craft-player">Craft Player</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ITEMS GRID -->
      <div id="itemsGrid" class="row g-4">
        <div class="col-md-3">
          <div class="skeleton" style="height: 180px; border-radius: var(--radius);"></div>
        </div>
        <div class="col-md-3">
          <div class="skeleton" style="height: 180px; border-radius: var(--radius);"></div>
        </div>
        <div class="col-md-3">
          <div class="skeleton" style="height: 180px; border-radius: var(--radius);"></div>
        </div>
        <div class="col-md-3">
          <div class="skeleton" style="height: 180px; border-radius: var(--radius);"></div>
        </div>
      </div>

      <!-- EMPTY STATE -->
      <div id="emptyState" class="text-center py-5 d-none">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <p class="text-muted mt-3">Tidak ada item yang ditemukan.</p>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container text-center pt-4 border-top"
      style="border-color: rgba(255,255,255,0.1) !important; color: rgba(255,255,255,0.5);">
      © 2026 Stellar Seekers. Made By Naraya◦.
    </div>
  </footer>

  <!-- ITEM DETAIL MODAL -->
  <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title fw-bold" id="modalName">Loading...</h5>
            <div id="modalType" class="small"></div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-4">
            <!-- Left: Image & Basic Info -->
            <div class="col-md-5 text-center">
              <div id="modalImage" class="mb-3 p-4 bg-light rounded d-flex align-items-center justify-content-center"
                style="min-height: 200px;">
                <span class="placeholder-icon fs-1">⏳</span>
              </div>
              <div id="modalPrices" class="d-flex flex-column gap-2"></div>
            </div>

            <!-- Right: Tabs -->
            <div class="col-md-7">
              <ul class="nav nav-pills mb-3 justify-content-center" id="modalTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active rounded-pill px-3" id="tab-stats" data-bs-toggle="pill"
                    data-bs-target="#panel-stats" type="button" role="tab">
                    <i class="bi bi-bar-chart me-1"></i>Stats
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link rounded-pill px-3" id="tab-obtain" data-bs-toggle="pill"
                    data-bs-target="#panel-obtain" type="button" role="tab">
                    <i class="bi bi-geo-alt me-1"></i>Obtain
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link rounded-pill px-3" id="tab-recipe" data-bs-toggle="pill"
                    data-bs-target="#panel-recipe" type="button" role="tab">
                    <i class="bi bi-diagram-3 me-1"></i>Enhancement Path
                  </button>
                </li>
              </ul>
              <div class="tab-content" id="modalTabContent">
                <div class="tab-pane fade show active" id="panel-stats" role="tabpanel">
                  <div id="modalStats" class="small"></div>
                </div>
                <div class="tab-pane fade" id="panel-obtain" role="tabpanel">
                  <div id="modalObtain" class="small"></div>
                </div>
                <div class="tab-pane fade" id="panel-recipe" role="tabpanel">
                  <div id="modalRecipe" class="small"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/modal.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let allItems = [];

      if (window.ToramSheets) {
        window.ToramSheets.load('items', 'itemsGrid');

        document.addEventListener('sheetsdataready', function (e) {
          if (e.detail.page === 'items') {
            allItems = e.detail.data;
            renderItems(allItems);
          }
        });
      }

      function renderItems(items) {
        const grid = document.getElementById('itemsGrid');
        const emptyState = document.getElementById('emptyState');
        grid.innerHTML = '';

        if (items.length === 0) {
          emptyState.classList.remove('d-none');
          return;
        }
        emptyState.classList.add('d-none');

        items.forEach(item => {
          const name = item['Name'] || '';
          const type = item['Type'] || '';
          const level = item['Level'] || '';
          const stats = item['Stats'] || '';
          const rarity = item['Rarity'] || '';
          const source = item['Source'] || '';
          const icon = item['Icon'] || '';
          const imgURL = item['ImageURL'] || '';

          const lvlText = level && level !== '0' ? ` · Lv.${level}` : '';

          // FIX 1: Rarity badge - cek non-event DULU sebelum event
          let rarityBadge = '';
          const rarityLower = rarity.toLowerCase();
          if (rarityLower.includes('non-event')) {
            rarityBadge = '<span class="badge bg-secondary">Non-Event</span>';
          } else if (rarityLower.includes('event')) {
            rarityBadge = '<span class="badge bg-warning text-dark">Event</span>';
          }

          // FIX 2: Source badges - parse source field
          const sourceLower = source.toLowerCase();
          let sourceBadges = '';

          if (sourceLower.includes('drop')) {
            sourceBadges += '<span class="badge bg-info text-dark"><i class="bi bi-bug me-1"></i>Drop</span>';
          }
          if (sourceLower.includes('craft npc') || sourceLower.includes('blacksmith npc')) {
            sourceBadges += '<span class="badge bg-success"><i class="bi bi-hammer me-1"></i>Craft NPC</span>';
          }
          if (sourceLower.includes('craft player') || sourceLower.includes('player craft')) {
            sourceBadges += '<span class="badge bg-primary"><i class="bi bi-person me-1"></i>Craft Player</span>';
          }

          const card = document.createElement('div');
          card.className = 'col-md-3 col-sm-6 fade-in-up';
          card.innerHTML = `
      <div class="item-card card h-100" onclick="window.ItemModal.open('${name.replace(/'/g, "\\'")}')">
        <div class="card-body p-3">
          <div class="d-flex align-items-center gap-3 mb-3">
            <div class="bg-light rounded p-2 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; font-size: 1.5rem;">
              ${window.ToramSheets.iconHTML(imgURL, icon, type, name)}
            </div>
            <div>
              <h6 class="fw-bold mb-0 text-truncate" style="color: var(--blue-dark); max-width: 150px;" title="${name}">${name}</h6>
              <small class="text-muted">${type}${lvlText}</small>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-1 mb-2">
            ${rarityBadge}
            ${sourceBadges}
            ${stats ? `<span class="badge bg-light text-dark border">Base: ${stats.split(';')[0]}</span>` : ''}
          </div>
          <small class="text-muted d-block text-truncate" title="${source}">${source ? '📍 ' + source : ''}</small>
        </div>
      </div>
    `;
          grid.appendChild(card);
        });
      }

      function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('filterType').value;
        const rarity = document.getElementById('filterRarity').value;
        const source = document.getElementById('filterSource').value;

        const filtered = allItems.filter(item => {
          const nameMatch = (item['Name'] || '').toLowerCase().includes(search);
          const typeMatch = type === 'all' || window.ToramSheets.typeToCategory(item['Type']) === type;

          const rLower = (item['Rarity'] || '').toLowerCase();
          const rarityMatch = rarity === 'all' || (rarity === 'event' && rLower.includes('event') && !rLower.includes('non')) || (rarity === 'non-event' && rLower.includes('non-event'));

          const sLower = (item['Source'] || '').toLowerCase();
          let sourceMatch = source === 'all';
          if (source === 'drop') sourceMatch = sLower.includes('drop');
          if (source === 'craft-npc') sourceMatch = sLower.includes('npc') || sLower.includes('smith');
          if (source === 'craft-player') sourceMatch = sLower.includes('player');

          return nameMatch && typeMatch && rarityMatch && sourceMatch;
        });

        renderItems(filtered);
      }

      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('filterType').addEventListener('change', applyFilters);
      document.getElementById('filterRarity').addEventListener('change', applyFilters);
      document.getElementById('filterSource').addEventListener('change', applyFilters);
    });
  </script>
</body>

</html>
